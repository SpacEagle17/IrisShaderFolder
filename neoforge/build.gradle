plugins {
	id 'java-library'
	id 'eclipse'
	id 'idea'
	id 'maven-publish'
	id 'net.neoforged.moddev' version '2.0.141'
	id 'com.gradleup.shadow' version '8.3.6'
	id "me.modmuss50.mod-publish-plugin"
}

version = "${versionProps.getProperty('mod_version')}-neoforge"
group = mod_group_id

base {
	archivesName = archives_base_name
}

def neoforgeProps = new Properties()
file("gradle.properties").withInputStream { neoforgeProps.load(it) }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
	mavenLocal()
	mavenCentral()
}

sourceSets.main.resources.srcDirs += project(':common').sourceSets.main.resources.srcDirs

neoForge {
	version = neoforgeProps.getProperty('neo_version')

	runs {
		client {
			type = "client"
			systemProperty 'forge.logging.markers', 'REGISTRIES'
			systemProperty 'forge.logging.console.level', 'debug'
		}
		server {
			type = "server"
			programArgument '--nogui'
		}
	}

	mods {
		"${mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
	shade
	implementation.extendsFrom(shade)
}

dependencies {
	implementation project(':common')
	shade project(':common')
}

// Disable the default jar; shadowJar is the production artifact
jar.enabled = false

shadowJar {
	configurations = [project.configurations.shade]
	from sourceSets.main.output
	archiveClassifier.set('')
	destinationDirectory.set(file("${rootProject.buildDir}/libs"))

	from("../LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}.txt" }
	}

	exclude 'META-INF/maven/**'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'

	manifest {
		from(project(':common').tasks.jar.manifest)
		attributes([
			"Specification-Title"    : mod_id,
			"Specification-Vendor"   : mod_authors,
			"Specification-Version"  : "1",
			"Implementation-Title"   : mod_name,
			"Implementation-Version" : project.version,
			"Implementation-Vendor"  : mod_authors
		])
	}

	minimize()
}

artifacts {
	archives shadowJar
}

build.dependsOn shadowJar

tasks.withType(ProcessResources).configureEach {
	var replaceProperties = [
		minecraft_version      : neoforgeProps.getProperty('minecraft_version'),
		minecraft_version_range: neoforgeProps.getProperty('minecraft_version_range'),
		neo_version            : neoforgeProps.getProperty('neo_version'),
		neo_version_range      : neoforgeProps.getProperty('neo_version_range'),
		loader_version_range   : neoforgeProps.getProperty('loader_version_range'),
		mod_id                 : mod_id,
		mod_name               : mod_name,
		mod_license            : mod_license,
		mod_version            : project.version,
		mod_authors            : mod_authors,
		mod_description        : mod_description
	]
	inputs.properties replaceProperties

	filesMatching('META-INF/*.toml') {
		expand replaceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}

// Make publish tasks depend on root confirmation and check skip flags
tasks.whenTaskAdded { task ->
	if (task.name == 'publishCurseforge') {
		task.dependsOn rootProject.tasks.confirmPublish
		task.onlyIf { !rootProject.ext.skipCurseforge }
	}
	if (task.name == 'publishModrinth') {
		task.dependsOn rootProject.tasks.confirmPublish
		task.onlyIf { !rootProject.ext.skipModrinth }
	}
}

publishMods {
	file = shadowJar.archiveFile

	changelog = rootProject.ext.changelogFile.text

	displayName = "Iris Shader Folder ${project.version}"

	type = STABLE
	modLoaders.add("neoforge")

	dryRun = rootProject.ext.publishTestRun

	curseforge {
		projectId = curseforge_project_id
		accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
		minecraftVersionRange {
			start = "1.21"
			end = "latestRelease"
		}
		clientRequired = true
		serverRequired = false
		requires("irisshaders")
	}
	modrinth {
		projectId = modrinth_project_id
		accessToken = providers.environmentVariable("MODRINTH_TOKEN")
		minecraftVersionRange {
			start = "1.21"
			end = "latestRelease"
			includeSnapshots = true
		}

		requires {
			slug = "iris"
		}
	}
}

tasks.named('publishMods').configure {
	dependsOn rootProject.tasks.confirmPublish
}
