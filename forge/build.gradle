plugins {
	id 'eclipse'
	id 'idea'
	id 'maven-publish'
	id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
	id 'com.github.johnrengelman.shadow' version '7.1.2'
	id 'org.spongepowered.mixin' version '0.7.+'
	id "me.modmuss50.mod-publish-plugin"
}

version = "${versionProps.getProperty('mod_version')}-forge"
group = mod_group_id

base {
	archivesName = archives_base_name
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(17)
	// Prevent :common's Java-8 targetCompatibility from downgrading this
	// project's compileClasspath JVM attribute, which would reject Forge's
	// Java 16/17 transitive deps during dependency resolution.
	disableAutoTargetJvm()
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
	mappings channel: mapping_channel, version: mapping_version

	copyIdeResources = true

	runs {
		configureEach {
			workingDirectory project.file('run')
			property 'forge.logging.markers', 'REGISTRIES'
			property 'forge.logging.console.level', 'debug'

			mods {
				"${mod_id}" {
					source sourceSets.main
				}
			}
		}

		client {
			property 'forge.enabledGameTestNamespaces', mod_id
		}

		server {
			property 'forge.enabledGameTestNamespaces', mod_id
			args '--nogui'
		}

		gameTestServer {
			property 'forge.enabledGameTestNamespaces', mod_id
		}

		data {
			workingDirectory project.file('run-data')
			args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
		}
	}
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
	maven { url = "https://maven.minecraftforge.net/" }
	mavenCentral()
	maven {
		name = 'SpongePowered'
		url = 'https://repo.spongepowered.org/repository/maven-public/'
	}
}

configurations {
	shade
	implementation.extendsFrom(shade)
}

dependencies {
	implementation project(':common')
	minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

	shade project(':common')

	compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
	shade "io.github.llamalad7:mixinextras-forge:0.5.0"

	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
	implementation 'org.spongepowered:mixin:0.8.5'
}

tasks.named('processResources', ProcessResources).configure {
	var replaceProperties = [
		minecraft_version      : minecraft_version,
		minecraft_version_range: minecraft_version_range,
		forge_version          : forge_version,
		forge_version_range    : forge_version_range,
		loader_version_range   : loader_version_range,
		mod_id                 : mod_id,
		mod_name               : mod_name,
		mod_license            : mod_license,
		mod_version            : project.version,
		mod_authors            : mod_authors,
		mod_description        : mod_description,
	]
	inputs.properties replaceProperties

	filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
		expand replaceProperties + [project: project]
	}
}

jar.enabled = false

shadowJar {
	configurations = [project.configurations.shade]
	from sourceSets.main.output
	archiveClassifier.set('')
	destinationDirectory.set(file("${rootProject.buildDir}/libs"))

	exclude 'META-INF/maven/**'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude 'META-INF/versions/**'
	exclude '**/module-info.class'

	from("../LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}.txt" }
	}

	manifest {
		from(project(':common').tasks.jar.manifest)
		attributes([
			'Specification-Title'   : mod_id,
			'Specification-Vendor'  : mod_authors,
			'Specification-Version' : '1',
			'Implementation-Title'  : project.name,
			'Implementation-Version': project.jar.archiveVersion,
			'Implementation-Vendor' : mod_authors,
			'MixinConfigs'          : 'iris_shader_folder.mixins.json'
		])
	}

	minimize()
}

mixin {
	add sourceSets.main, 'iris_shader_folder.refmap.json'
	config 'iris_shader_folder.mixins.json'
}

reobf {
	shadowJar {}
}

artifacts {
	archives shadowJar
}

build.dependsOn reobfShadowJar

tasks.named('jar') {
	enabled = true
	finalizedBy shadowJar
}

sourceSets.main.resources.srcDirs += project(':common').sourceSets.main.resources.srcDirs

sourceSets.each {
	def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
	it.output.resourcesDir = dir
	it.java.destinationDirectory = dir
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 8
	options.compilerArgs.addAll([
		'-AdisableTargetValidator=true',
		'-Xlint:-processing'
	])
}

eclipse {
	synchronizationTasks 'genEclipseRuns'
}

tasks.whenTaskAdded { task ->
	if (task.name == 'publishCurseforge') {
		task.dependsOn rootProject.tasks.confirmPublish
		task.onlyIf { !rootProject.ext.skipCurseforge }
	}
	if (task.name == 'publishModrinth') {
		task.dependsOn rootProject.tasks.confirmPublish
		task.onlyIf { !rootProject.ext.skipModrinth }
	}
}

publishMods {
	file = shadowJar.archiveFile

	changelog = rootProject.ext.changelogFile.text

	displayName = "Iris Shader Folder ${project.version}"

	type = STABLE
	modLoaders.add("forge")

	dryRun = rootProject.ext.publishTestRun

	curseforge {
		projectId = curseforge_project_id
		accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
		minecraftVersionRange {
			start = "1.16"
			end = "1.20.1"
		}
		clientRequired = true
		serverRequired = false
		requires("oculus")
	}
	modrinth {
		projectId = modrinth_project_id
		accessToken = providers.environmentVariable("MODRINTH_TOKEN")
		minecraftVersionRange {
			start = "1.16"
			end = "1.20.1"
		}

		requires {
			slug = "oculus"
		}
	}
}

tasks.named('publishMods').configure {
	dependsOn rootProject.tasks.confirmPublish
	dependsOn reobfShadowJar
}
